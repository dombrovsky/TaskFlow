name: Documentation

on:
  push:
    branches: [ "main" ]
    paths:
      - "docs/**"
      - "README.md"
      - "TaskFlow/README.md"
      - "TaskFlow.Extensions.Time/README.md"
      - "TaskFlow.Extensions.Microsoft.DependencyInjection/README.md"
      - "TaskFlow.Extensions.Microsoft.Logging/README.md"
      - ".github/workflows/documentation.yml"
  pull_request:
    branches: [ "main" ]
    paths:
      - "docs/**"
      - "README.md"
      - "TaskFlow/README.md"
      - "TaskFlow.Extensions.Time/README.md"
      - "TaskFlow.Extensions.Microsoft.DependencyInjection/README.md"
      - "TaskFlow.Extensions.Microsoft.Logging/README.md"
      - ".github/workflows/documentation.yml"
  workflow_dispatch:
  workflow_run:
    workflows: ["Benchmark history"]
    types: [completed]

permissions:
  contents: read

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event_name == 'workflow_run' && 'main' || github.sha }}
          persist-credentials: false
          fetch-depth: 0

      - name: Include durable benchmark history
        run: |
          mkdir -p docs/benchmarks/data
          if git show-ref --verify --quiet refs/remotes/origin/benchmark-data; then
            git archive origin/benchmark-data | tar -x -C docs/benchmarks/data
          else
            echo '{"schema":1,"records":[]}' > docs/benchmarks/data/index.json
          fi

      - name: Configure GitHub Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v5

      - name: Build the rendered site
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./docs
          destination: ./_site

      - name: Upload GitHub Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./_site

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4